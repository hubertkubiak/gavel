<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-surface focus:px-4 focus:py-2"
  >Przejdź do treści</a
>

<header class="glass sticky top-0 z-50 border-b border-border/70">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4 sm:px-6">
    <a
      routerLink="/"
      class="group flex items-center gap-2.5 rounded-lg"
      aria-label="Gavel — strona główna"
    >
      <span
        class="grid size-9 place-items-center rounded-xl bg-accent-strong text-accent-fg shadow-[0_0_24px_-6px_var(--accent-strong)] transition-transform group-hover:-rotate-12"
      >
        <svg lucideGavel [size]="18" [strokeWidth]="2.25" aria-hidden="true"></svg>
      </span>
      <span class="text-lg font-semibold tracking-tight">Gavel</span>
    </a>

    <div class="ml-auto flex items-center gap-2">
      <button
        type="button"
        class="btn btn-ghost btn-icon hidden sm:inline-flex"
        (click)="toggleDevPanel()"
        [attr.aria-pressed]="devPanelOpen()"
        aria-label="Panel deweloperski (Ctrl + .)"
        title="Panel deweloperski (Ctrl + .)"
      >
        <svg lucideTerminal [size]="18" aria-hidden="true"></svg>
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-icon"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'"
      >
        @if (theme.theme() === 'dark') {
          <svg lucideSun [size]="18" aria-hidden="true"></svg>
        } @else {
          <svg lucideMoon [size]="18" aria-hidden="true"></svg>
        }
      </button>
      @if (nickname.nickname(); as nick) {
        <button
          type="button"
          class="btn btn-ghost h-10 gap-2 pl-1.5 pr-3"
          (click)="changeNickname()"
          [attr.aria-label]="'Zalogowano jako ' + nick + '. Zmień nick'"
        >
          <gv-avatar [nick]="nick" [size]="28" />
          <span class="max-w-28 truncate">{{ nick }}</span>
        </button>
      } @else {
        <button type="button" class="btn btn-primary" (click)="changeNickname()">
          Wybierz nick
        </button>
      }
    </div>
  </div>
</header>

<main id="main" class="mx-auto max-w-7xl px-4 pb-32 pt-6 sm:px-6 lg:pb-16">
  <router-outlet />
</main>

<ngx-sonner-toaster
  [theme]="theme.theme()"
  position="top-center"
  [richColors]="true"
  [closeButton]="false"
/>

@if (devPanelOpen()) {
  <gv-dev-panel (closed)="devPanelOpen.set(false)" />
}
