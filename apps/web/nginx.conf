server {
  listen 4200;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Same-origin API: Connect / gRPC-Web calls go to @gavel/api (see environment.prod.ts).
  location /auction.v1.AuctionService/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # WatchItem is a long-lived server stream: pass every message through immediately.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }

  # Only content-hashed build output (main-ABCD1234.js, media/font-ABCD1234.woff2) is immutable.
  # Unhashed files from public/ (favicon, /items/*.svg) use default revalidation.
  location ~* -[a-z0-9]{8}\.(js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for Angular routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
