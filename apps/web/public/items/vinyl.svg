    <circle r="66" fill="none" stroke="#7c3aed" stroke-width="6"/>
    <text y="-14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1130">MONO</text>
    <text y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1130">33⅓ RPM · 1959</text>
