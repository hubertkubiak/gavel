    <rect x="104" y="372" width="588" height="24" fill="#18161e"/>
    <rect x="107" y="207" width="36" height="36" rx="7" fill="url(#accent)"/>
    <rect x="653" y="207" width="36" height="36" rx="7" fill="url(#accent)"/>
    <rect x="611" y="333" width="78" height="36" rx="7" fill="url(#accent)"/>
