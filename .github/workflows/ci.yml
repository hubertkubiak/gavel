name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking compares against main

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (runs buf generate)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: buf lint
        run: pnpm buf:lint

      - name: buf breaking (vs main)
        if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking --against ".git#branch=origin/main"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E (Playwright)
        run: |
          pnpm -F @gavel/e2e exec playwright install --with-deps chromium
          pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
